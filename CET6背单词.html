<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1118">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>背单词 · CET-6</title>
<style>
:root{
  --bg:#0e1118; --bg2:#151b26; --card:#1a2130; --card2:#212a3c;
  --line:#2a3446; --fg:#e8edf6; --fg2:#9aa7bd; --fg3:#66748c;
  --acc:#37c08a; --acc2:#2aa3ff; --warn:#ffb020; --dan:#ff5d5d;
  --sh:0 6px 24px rgba(0,0,0,.35);
  --r:16px;
}
html[data-theme="light"]{
  --bg:#f4f6fb; --bg2:#ffffff; --card:#ffffff; --card2:#f0f3f9;
  --line:#e2e8f2; --fg:#16202f; --fg2:#5a6a83; --fg3:#8c9ab1;
  --acc:#12a86f; --acc2:#1f7fe0; --sh:0 6px 20px rgba(20,40,80,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:16px; line-height:1.5; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:680px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.hidden{display:none !important}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit}

/* ---------- top bar ---------- */
#topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(160%) blur(12px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{
  width:34px;height:34px;border-radius:10px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:grid;place-items:center;font-weight:700;color:#fff;font-size:17px;
}
.t1{font-weight:650;font-size:15px;letter-spacing:.2px}
.t2{font-size:11.5px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topRight{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.pill{
  font-size:11.5px;padding:4px 9px;border-radius:999px;
  background:var(--card2);color:var(--fg2);border:1px solid var(--line);white-space:nowrap;
}
.pill.acc{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc);border-color:color-mix(in srgb,var(--acc) 35%,transparent)}
.pill.acc.hot{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}

/* ---------- layout ---------- */
#main{flex:1;padding:14px 14px calc(84px + env(safe-area-inset-bottom))}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card + .card{margin-top:12px}
.sec-title{font-size:13px;color:var(--fg3);margin:18px 2px 8px;font-weight:600;letter-spacing:.4px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.spacer{flex:1}
.muted{color:var(--fg2)}
.dim{color:var(--fg3)}
.small{font-size:13px}
.tiny{font-size:12px}
.center{text-align:center}
.mono{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 16px;border-radius:12px;background:var(--card2);
  border:1px solid var(--line);font-weight:600;font-size:14px;
  transition:transform .08s ease,filter .15s ease;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff}
.btn.ghost{background:transparent}
.btn.block{display:flex;width:100%}
.btn.lg{padding:14px 18px;font-size:16px;border-radius:14px}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- study ---------- */
.study-wrap{display:flex;flex-direction:column;gap:12px}
.progress-line{height:5px;background:var(--card2);border-radius:99px;overflow:hidden}
.progress-line > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .25s ease}
.qmeta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg3)}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--fg2)}
.tag.new{color:var(--acc2);border-color:color-mix(in srgb,var(--acc2) 35%,transparent)}
.tag.rev{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 35%,transparent)}
.tag.spell{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}

.word-card{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:30px 18px;text-align:center;box-shadow:var(--sh);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
}
.word{font-size:40px;font-weight:700;letter-spacing:.4px;line-height:1.15;word-break:break-word}
.word.small{font-size:30px}
.ipa{font-size:15px;color:var(--fg2);min-height:20px}
.ipa .spk{
  margin-left:6px;font-size:15px;padding:2px 8px;border-radius:8px;background:var(--card2);
  border:1px solid var(--line);vertical-align:middle
}
.def-box{
  margin-top:6px;padding:14px;border-radius:14px;background:var(--card2);
  border:1px dashed var(--line);width:100%;text-align:left;font-size:16px;line-height:1.7;
}
.def-box .pos{color:var(--acc);font-weight:600;margin-right:6px}
.def-box .ex{margin-top:8px;font-size:13.5px;color:var(--fg2);border-top:1px solid var(--line);padding-top:8px}
.def-box .ex b{color:var(--fg)}
.hint{font-size:12.5px;color:var(--fg3)}
.reveal-tap{width:100%;padding:22px 10px;border-radius:14px;border:1px dashed var(--line);color:var(--fg3);font-size:14px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions.g4{grid-template-columns:1fr 1fr}
.actions.g3{grid-template-columns:1fr 1fr 1fr}
.actions.g1{grid-template-columns:1fr}
.gbtn{padding:15px 10px;border-radius:14px;font-weight:650;font-size:15px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:2px;align-items:center}
.gbtn small{font-weight:400;font-size:11px;opacity:.75}
.gbtn.g0{color:var(--dan);border-color:color-mix(in srgb,var(--dan) 40%,transparent);background:color-mix(in srgb,var(--dan) 12%,transparent)}
.gbtn.g1{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.gbtn.g2{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.gbtn.g3{color:var(--acc2);border-color:color-mix(in srgb,var(--acc2) 40%,transparent);background:color-mix(in srgb,var(--acc2) 12%,transparent)}
.gbtn:active{transform:scale(.98)}

.spell-input{
  width:100%;padding:14px 16px;border-radius:14px;background:var(--card2);
  border:1.5px solid var(--line);color:var(--fg);font-size:20px;letter-spacing:1px;outline:none;text-align:center
}
.spell-input:focus{border-color:var(--acc2)}
.spell-ok{border-color:var(--acc) !important}
.spell-bad{border-color:var(--dan) !important}
.choices{display:flex;flex-direction:column;gap:9px}
.choice{
  text-align:left;padding:13px 14px;border-radius:13px;background:var(--card);
  border:1px solid var(--line);font-size:14.5px;line-height:1.5
}
.choice:active{transform:scale(.99)}
.choice.right{background:color-mix(in srgb,var(--acc) 16%,transparent);border-color:var(--acc)}
.choice.wrong{background:color-mix(in srgb,var(--dan) 16%,transparent);border-color:var(--dan)}

.big-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.big-num{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.big-num b{display:block;font-size:24px;font-weight:700;line-height:1.2}
.big-num span{font-size:11.5px;color:var(--fg3)}

.bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:6px}
.bars .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bars .bar i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--acc),var(--acc2));min-height:2px}
.bars .bar span{font-size:10.5px;color:var(--fg3)}

.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(13px,1fr));gap:3px}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:var(--card2)}
.heat i.l1{background:color-mix(in srgb,var(--acc) 28%,var(--card2))}
.heat i.l2{background:color-mix(in srgb,var(--acc) 55%,var(--card2))}
.heat i.l3{background:color-mix(in srgb,var(--acc) 78%,var(--card2))}
.heat i.l4{background:var(--acc)}

.list{display:flex;flex-direction:column}
.list .it{display:flex;gap:10px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it b{font-weight:650;font-size:15px}
.list .it .lv{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--card2);color:var(--fg3);border:1px solid var(--line);white-space:nowrap;margin-top:3px}
.search{
  width:100%;padding:11px 14px;border-radius:12px;background:var(--card2);
  border:1px solid var(--line);color:var(--fg);outline:none;font-size:14px
}
.search:focus{border-color:var(--acc2)}

.set-item{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.set-item:last-child{border-bottom:0}
.set-item .lbl{flex:1;min-width:0}
.set-item .lbl b{font-weight:600;font-size:14.5px;display:block}
.set-item .lbl span{font-size:12px;color:var(--fg3)}
.switch{position:relative;width:46px;height:27px;border-radius:99px;background:var(--card2);border:1px solid var(--line);flex:0 0 auto;transition:background .18s}
.switch i{position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:99px;background:var(--fg3);transition:transform .18s,background .18s}
.switch.on{background:color-mix(in srgb,var(--acc) 40%,transparent);border-color:var(--acc)}
.switch.on i{transform:translateX(19px);background:var(--acc)}
select,input[type="number"]{
  background:var(--card2);border:1px solid var(--line);color:var(--fg);
  border-radius:10px;padding:8px 10px;outline:none
}
input[type="number"]{width:78px;text-align:center}

#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);
  background:color-mix(in srgb,var(--bg2) 92%,transparent);
  backdrop-filter:saturate(160%) blur(12px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
#tabbar button{padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--fg3);font-size:11px}
#tabbar button i{font-size:19px;font-style:normal;line-height:1}
#tabbar button.on{color:var(--acc)}
#tabbar button .badge{position:absolute;transform:translate(14px,-6px);background:var(--dan);color:#fff;font-size:10px;padding:0 5px;border-radius:99px;line-height:15px}

#toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(20,26,38,.95);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:88vw;text-align:center;
  border:1px solid rgba(255,255,255,.12)
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}

#modal{position:fixed;inset:0;z-index:50;background:rgba(6,9,15,.62);display:flex;align-items:flex-end;justify-content:center;padding:0}
#modal .sheet{
  background:var(--bg2);width:100%;max-width:680px;border-radius:20px 20px 0 0;
  padding:18px 16px calc(22px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  max-height:86vh;overflow:auto;animation:up .22s ease
}
@keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
#modal h3{margin:2px 0 10px;font-size:17px}
.kbd{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--card2);border:1px solid var(--line);color:var(--fg2)}
.hr{height:1px;background:var(--line);margin:12px 0}
.warnbox{background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);color:var(--warn);padding:10px 12px;border-radius:12px;font-size:13px}
.okbox{background:color-mix(in srgb,var(--acc) 14%,transparent);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);color:var(--acc);padding:10px 12px;border-radius:12px;font-size:13px}
.dl{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:8px}
.dl > i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <span class="logo">词</span>
      <div style="min-width:0">
        <div class="t1">CET-6 背单词</div>
        <div class="t2" id="topSub">正在载入…</div>
      </div>
    </div>
    <div class="topRight">
      <span class="pill" id="pillStreak">🔥 0 天</span>
      <span class="pill acc" id="pillDue">待复习 0</span>
    </div>
  </header>

  <main id="main">
    <section class="view" id="v-study"></section>
    <section class="view hidden" id="v-stats"></section>
    <section class="view hidden" id="v-deck"></section>
    <section class="view hidden" id="v-set"></section>
  </main>

  <nav id="tabbar">
    <button data-tab="study" class="on"><i>📖</i><span>学习</span></button>
    <button data-tab="stats"><i>📈</i><span>统计</span></button>
    <button data-tab="deck"><i>📚</i><span>词库</span></button>
    <button data-tab="set"><i>⚙️</i><span>设置</span></button>
  </nav>
</div>
<div id="toast"></div>
<div id="modal" class="hidden"></div>

<!-- 打包成独立版时，完整词库会被写进下面这个数据块；默认留空 -->
<script type="application/json" id="embeddedDeck"></script>

   ======================================================================= */

/* ------------------------------------------------------------------ *
 * 0. 内置核心词库（离线即可用）

["catastrophe","/kəˈtæstrəfi/","n. 大灾难，灾祸；惨败"],
["cease","/siːs/","v. 停止，终止，结束"],
["circumstance","/ˈsɜːkəmstəns/","n. 情况，环境；境遇（常用复数）"],
["coherent","/kəʊˈhɪərənt/","adj. 连贯的，条理清楚的；一致的"],
["collapse","/kəˈlæps/","v. 倒塌；崩溃；晕倒  n. 倒塌；崩溃"],

["compensate","/ˈkɒmpenseɪt/","v. 补偿，赔偿；弥补"],
["competent","/ˈkɒmpɪtənt/","adj. 有能力的，胜任的；合格的"],
["comprehensive","/ˌkɒmprɪˈhensɪv/","adj. 全面的，综合的；有理解力的"],
["compromise","/ˈkɒmprəmaɪz/","n. 妥协，折中  v. 妥协；危及"],
["conceive","/kənˈsiːv/","v. 构想，设想；怀孕"],
["condemn","/kənˈdem/","v. 谴责，指责；判刑，宣告有罪"],
["confront","/kənˈfrʌnt/","v. 面对，正视；使对质"],
["consensus","/kənˈsensəs/","n. 共识，一致意见"],
["consequence","/ˈkɒnsɪkwəns/","n. 结果，后果；重要性"],
["conserve","/kənˈsɜːv/","v. 保护，保存；节约（能源等）"],
["considerable","/kənˈsɪdərəbl/","adj. 相当大的，可观的；值得考虑的"],
["constitute","/ˈkɒnstɪtjuːt/","v. 构成，组成；设立，任命"],

["contradict","/ˌkɒntrəˈdɪkt/","v. 反驳，否认；与…相矛盾"],
["controversial","/ˌkɒntrəˈvɜːʃl/","adj. 有争议的，引起争论的"],
["converge","/kənˈvɜːdʒ/","v. 聚集，集中；趋同，趋于一致"],
["convey","/kənˈveɪ/","v. 传达，表达；运送，传送"],
["convince","/kənˈvɪns/","v. 使信服，说服，使确信"],
["cope","/kəʊp/","v. 应对，处理，对付（cope with）"],

function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function load(k, d){
  try{ var v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; }
}
function save(k, v){

}
/* 进度/统计较大，答题时合并写入，避免每次作答都全量序列化 */
var _saveT = {}, _saveP = {};
function saveSoon(k, v){
  _saveP[k] = v;
  if(_saveT[k]) return;
  _saveT[k] = setTimeout(function(){ _saveT[k] = null; var x = _saveP[k]; delete _saveP[k]; if(x !== undefined) save(k, x); }, 700);
}
function flushSaves(){
  for(var k in _saveP){
    if(_saveT[k]){ clearTimeout(_saveT[k]); _saveT[k] = null; }
    save(k, _saveP[k]); delete _saveP[k];
  }
}
function pad2(n){ return n<10 ? "0"+n : ""+n; }
function dayKey(ts){
  var d = new Date(ts==null?Date.now():ts);
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
}
function startOfDay(ts){
  var d = new Date(ts==null?Date.now():ts); d.setHours(0,0,0,0); return d.getTime();
}
function toast(msg, ms){
  var t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("on"); }, ms||1900);
}
/* 间隔的人类可读形式 */
function fmtGap(ms){
  if(ms <= 0) return "现在";
  var m = ms/MIN;
  if(m < 1) return "1 分钟内";
  if(m < 60) return Math.round(m)+" 分钟";
  var h = m/60;
  if(h < 24) return (h<10 ? h.toFixed(1).replace(/\.0$/,"") : Math.round(h))+" 小时";
  var d = h/24;
  if(d < 30) return (d<10 ? d.toFixed(1).replace(/\.0$/,"") : Math.round(d))+" 天";
  var mo = d/30;
  if(mo < 12) return mo.toFixed(1).replace(/\.0$/,"")+" 个月";
  return (d/365).toFixed(1).replace(/\.0$/,"")+" 年";
}
/* 记忆等级 0-5 */
var LEVEL_NAME = ["未学","初识","模糊","熟悉","牢固","精通"];
function levelOf(p){
  if(!p || !p.seen) return 0;
  var d = p.iv * 1;
  if(d <= 1) return 1;
  if(d < 3) return 2;
  if(d < 7) return 3;
  if(d < 21) return 4;
  return 5;
}
/* 简化的遗忘曲线：按已过去时间占间隔的比例估算保留率 */
function retention(p, now){
  if(!p || !p.seen || !p.iv) return 0;
  var elapsed = ((now==null?Date.now():now) - (p.last||now)) / DAY;
  var s = p.iv;
  if(elapsed <= 0) return 1;
  return Math.exp(-elapsed / Math.max(s, 0.02) * 0.7);
}
function speak(text){
  if(!("speechSynthesis" in window)) { return; }
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.92; u.pitch = 1;
    var v = pickVoice();
    if(v) u.voice = v;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
var _voices = [];
function refreshVoices(){ try{ _voices = window.speechSynthesis.getVoices() || []; }catch(e){ _voices = []; } }
function pickVoice(){
  if(!_voices.length) refreshVoices();
  var pref = null;
  for(var i=0;i<_voices.length;i++){
    var v = _voices[i], n = (v.name||"")+" "+(v.lang||"");
    if(/en[-_]US/i.test(v.lang||"")) { if(/Google|Natural|Samantha|Aria|Jenny|Zira/i.test(n)) return v; if(!pref) pref = v; }
  }
  if(pref) return pref;
  for(var j=0;j<_voices.length;j++){ if(/^en/i.test(_voices[j].lang||"")) return _voices[j]; }
  return null;
}
if("speechSynthesis" in window){
  refreshVoices();
  try{ window.speechSynthesis.onvoiceschanged = refreshVoices; }catch(e){}
}

/* ------------------------------------------------------------------ *
 * 2. 词库与状态

var S = {
  deck: [], prog: {}, set: {}, stats: {}, meta: {}, sess: null, tab: "study"
};

/* 把 "word\t释义" 文本解析成词条数组 */
function parseDeckText(text){
  var out = [], seen = {};
  var lines = String(text).replace(/\r/g,"").split("\n");
  for(var i=0;i<lines.length;i++){
    var ln = lines[i];
    if(!ln || !ln.trim()) continue;
    var w = "", def = "";
    var tab = ln.indexOf("\t");
    if(tab > 0){ w = ln.slice(0,tab); def = ln.slice(tab+1); }
    else {
      var m = ln.match(/^\s*([A-Za-z][A-Za-z'’\-\. ]*?)\s{1,}(.+)$/);
      if(!m) continue;
      w = m[1]; def = m[2];
    }
    w = w.trim(); def = (def||"").trim();
    if(!/^[A-Za-z]/.test(w)) continue;
    var key = w.toLowerCase();
    if(seen[key]) continue;
    seen[key] = 1;
    out.push({ w: w, ipa: "", def: def });
  }
  return out;
}
/* 解析 json / jsonl（兼容 KyleBing 词库格式） */
function parseDeckJson(text){
  text = String(text).trim();
  var arr = null;
  if(text.charAt(0) === "["){
    try{ arr = JSON.parse(text); }catch(e){ arr = null; }
  }
  if(!arr){
    arr = [];
    var lines = text.replace(/\r/g,"").split("\n");
    for(var i=0;i<lines.length;i++){
      var ln = lines[i].trim();
      if(!ln) continue;
      try{ arr.push(JSON.parse(ln)); }catch(e){}
    }
  }
  var out = [], seen = {};
  (arr||[]).forEach(function(o){
    if(!o || !o.word) return;
    var key = String(o.word).toLowerCase();
    if(seen[key]) return;
    seen[key] = 1;
    var def = "";
    if(o.translations && o.translations.length){
      def = o.translations.map(function(t){
        return (t.type ? t.type + ". " : "") + (t.translation||"");
      }).join("；");
    } else if(o.translation){ def = o.translation; }
    else if(o.def){ def = o.def; }
    var ipa = o.phonetic || o.usphone || o.ukphone || "";
    if(ipa && ipa.charAt(0) !== "/") ipa = "/"+ipa+"/";
    var ex = null;
    if(o.sentences && o.sentences.length){
      var s0 = o.sentences[0];
      ex = { en: s0.sContent || s0.en || "", cn: s0.sCn || s0.cn || "" };
    }
    out.push({ w: o.word, ipa: ipa, def: def, ex: ex });
  });
  return out;
}
/* 独立打包版里内嵌词库的数据块 */
function embeddedDeck(){
  var el = document.getElementById("embeddedDeck");
  if(!el) return null;
  var t = (el.textContent || "").trim();
  if(!t) return null;
  try{ var o = JSON.parse(t); return (o && o.text) ? o : null; }catch(e){ return null; }
}
function parseByFmt(text, fmt){ return (fmt === "json") ? parseDeckJson(text) : parseDeckText(text); }
function deckFromStorage(){
  var d = load(LS.deck, null);
  if(d && d.text){
    var arr = parseByFmt(d.text, d.fmt);
    if(arr.length){ S.meta.src = d.src || "import"; S.meta.srcName = d.name || "外部词库"; return arr; }
  }
  var em = embeddedDeck();
  if(em){
    var a2 = parseByFmt(em.text, em.fmt);
    if(a2.length){ S.meta.src = "embedded"; S.meta.srcName = em.name || "内置完整词库"; return a2; }
  }
  S.meta.src = "seed"; S.meta.srcName = "内置核心词";
  return SEED.map(function(a){ return { w:a[0], ipa:a[1], def:a[2] }; });
}
function saveDeckText(text, fmt, src, name){
  var arr = parseByFmt(text, fmt);
  if(arr.length < 10) throw new Error("解析到的单词太少（"+arr.length+"），格式可能不对");
  if(!save(LS.deck, { text:text, fmt:fmt, src:src, name:name })) return null;
  S.deck = arr;
  S.meta.src = src; S.meta.srcName = name;
  rebuildIndex();
  return arr;
}
var INDEX = {};   /* 小写 -> 词条 */
function rebuildIndex(){
  INDEX = {};
  for(var i=0;i<S.deck.length;i++) INDEX[S.deck[i].w.toLowerCase()] = S.deck[i];
}
function findWord(w){ return INDEX[String(w).toLowerCase()] || null; }

/* ------------------------------------------------------------------ *
 * 3. 设置 / 统计读写
 * ------------------------------------------------------------------ */
function loadAll(){
  S.set = Object.assign({}, DEF_SET, load(LS.set, {}));
  S.stats = load(LS.stats, { days:{}, total:{n:0,r:0,a:0,g:0,q:0} });
  if(!S.stats.days) S.stats.days = {};
  if(!S.stats.total) S.stats.total = {n:0,r:0,a:0,g:0,q:0};
  S.prog = load(LS.prog, {});
  S.meta = load(LS.flag, {});
  S.deck = deckFromStorage();
  rebuildIndex();
  applyTheme();
}
function saveProg(){ saveSoon(LS.prog, S.prog); }
function saveStats(){ saveSoon(LS.stats, S.stats); }
function saveSet(){ save(LS.set, S.set); }
function today(){
  var k = dayKey();
  if(!S.stats.days[k]) S.stats.days[k] = { n:0, r:0, a:0, g:0, q:0 };
  return S.stats.days[k];
}
function applyTheme(){
  document.documentElement.setAttribute("data-theme", S.set.theme === "light" ? "light" : "dark");
  var m = $('meta[name="theme-color"]');
  if(m) m.setAttribute("content", S.set.theme === "light" ? "#f4f6fb" : "#0e1118");
}

/* 学习历史（用于连击天数） */
function streakDays(){
  var keys = Object.keys(S.stats.days).filter(function(k){
    var d = S.stats.days[k];
    return d && (d.n || d.r);
  }).sort();
  if(!keys.length) return 0;
  var set = {};
  keys.forEach(function(k){ set[k] = 1; });
  var cur = new Date(); cur.setHours(0,0,0,0);
  var n = 0;
  /* 允许今天还没学，从昨天开始算 */
  if(!set[dayKey(cur.getTime())]) cur = new Date(cur.getTime() - DAY);
  while(set[dayKey(cur.getTime())]){
    n++; cur = new Date(cur.getTime() - DAY);
  }
  return n;
}
/* ------------------------------------------------------------------ *
 * 4. 记忆调度：改良 SM-2
 *    评分 g：0 忘记 / 1 模糊 / 2 认识 / 3 简单
 *    间隔 iv 以「天」为单位（可为小数，10 分钟 = 10/1440 天）
 * ------------------------------------------------------------------ */
var GRADES = [
  { g:0, name:"忘记", tip:"完全没想起来", cls:"g0" },
  { g:1, name:"模糊", tip:"想了好久才想起", cls:"g1" },
  { g:2, name:"认识", tip:"稍作回忆就想起来", cls:"g2" },
  { g:3, name:"简单", tip:"一眼就会，太简单", cls:"g3" }
];
function newProg(){ return { iv:0, ef:2.5, due:0, seen:0, reps:0, lapses:0, last:0, h:[] }; }
function gradeWord(w, g, now){
  now = now || Date.now();
  var k = w.toLowerCase();
  var p = S.prog[k] || (S.prog[k] = newProg());
  var first = !p.seen;
  p.seen++; p.reps++;
  if(g === 0){
    if(!first) p.lapses++;
    p.ef = Math.max(1.3, p.ef - 0.20);
    p.iv = 10/1440;                       /* 10 分钟后再考一次 */
  } else if(g === 1){
    p.ef = Math.max(1.3, p.ef - 0.15);
    p.iv = first ? 0.5 : Math.max(p.iv * 1.2, 1/24);
  } else if(g === 2){
    p.iv = (p.iv < 1) ? 1 : Math.min(p.iv * p.ef, 365);
  } else {
    p.ef = Math.min(3.0, p.ef + 0.15);
    p.iv = (p.iv < 1) ? 3 : Math.min(p.iv * p.ef * 1.3, 365);
  }
  if(p.iv < 10/1440) p.iv = 10/1440;
  p.last = now;
  p.due = now + Math.round(p.iv * DAY);
  p.h.push(g); if(p.h.length > 8) p.h.shift();
  return p;
}
function isLearned(w){ var p = S.prog[w.toLowerCase()]; return !!(p && p.seen); }
function dueList(now){
  now = now || Date.now();
  var out = [];
  for(var k in S.prog){
    var p = S.prog[k];
    if(p && p.seen && p.due <= now && INDEX[k]) out.push(k);
  }
  out.sort(function(a,b){ return S.prog[a].due - S.prog[b].due; });
  return out;
}
function newList(limit, skipSet){
  var out = [];
  for(var i=0;i<S.deck.length;i++){
    if(out.length >= limit) break;
    var w = S.deck[i].w, k = w.toLowerCase();
    if(S.prog[k]) continue;
    if(skipSet && skipSet[k]) continue;
    out.push(w);
  }
  return out;
}
function learnedCount(){
  var n = 0;
  for(var k in S.prog){ if(S.prog[k] && S.prog[k].seen && INDEX[k]) n++; }
  return n;
}
function nextDueAt(){
  var best = Infinity;
  for(var k in S.prog){
    var p = S.prog[k];
    if(p && p.seen && INDEX[k] && p.due < best) best = p.due;
  }
  return best === Infinity ? null : best;
}
/* 未来 n 天的到期量（含今天已到期的积压） */
function forecast(days){
  var now = Date.now(), s0 = startOfDay(now), out = [];
  for(var i=0;i<days;i++) out.push(0);
  for(var k in S.prog){
    var p = S.prog[k];
    if(!p || !p.seen || !INDEX[k]) continue;
    var d = Math.floor((startOfDay(p.due) - s0) / DAY);
    if(d < 0) d = 0;
    if(d < days) out[d]++;
  }
  return out;
}

/* ------------------------------------------------------------------ *
 * 5. 学习会话
 * ------------------------------------------------------------------ */
function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function makeItem(word, isNew){
  var p = S.prog[word.toLowerCase()];
  var lv = levelOf(p), q = "card";
  if(!isNew && lv >= 2){
    var r = Math.random();
    if(r < S.set.spellRatio) q = "spell";
    else if(r < S.set.spellRatio + S.set.choiceRatio) q = "choice";
  }
  return { w: word, q: q, isNew: !!isNew, counted:false, wrong:0 };
}
function buildQueue(){
  var now = Date.now(), t = today();
  var newLeft = Math.max(0, (S.set.newPerDay|0) - (t.n|0));
  var due = dueList(now).slice(0, Math.max(0, S.set.reviewPerDay|0));
  var news = newList(newLeft);
  var items = [];
  due.forEach(function(k){
    var d = findWord(k); if(d) items.push(makeItem(d.w, false));
  });
  news.forEach(function(w){ items.push(makeItem(w, true)); });
  return items;
}
function startSession(){
  var q = buildQueue();
  if(!q.length){
    toast("今天没有要学的了，休息一下 🎉");
    return;
  }
  S.sess = {
    q: q, cur: null, phase: "q", plan: q.length,
    startedAt: Date.now(), answered: 0, right: 0, again: 0,
    newCount: q.filter(function(i){ return i.isNew; }).length,
    revCount: q.filter(function(i){ return !i.isNew; }).length,
    lastResult: null, finished: false
  };
  nextItem();
}
function nextItem(){
  var s = S.sess;
  if(!s) return;
  if(!s.q.length){ finishSession(); return; }
  s.cur = s.q.shift();
  s.phase = "q";
  s.lastResult = null;
  renderStudy();
  var it = s.cur;
  if(S.set.autoSpeak && it.q !== "spell") speak(it.w);
  if(it.q !== "spell" && S.set.onlinePhonetic){
    ensurePhonetic(it.w, function(){
      var el = $("#curIpa");
      if(el && S.sess && S.sess.cur && S.sess.cur.w === it.w) fillIpa(el, it.w);
    });
  }
}
function finishSession(){
  var s = S.sess;
  if(!s) return;
  s.finished = true;
  renderStudy();
  saveStats(); saveProg();
}
/* 记录一次作答 */
function record(it, g){
  var t = today(), tot = S.stats.total;
  t.q++; tot.q++;
  if(g === 0){ t.a++; tot.a++; }
  if(g >= 2){ t.g++; tot.g++; }
  if(!it.counted){
    it.counted = true;
    if(it.isNew){ t.n++; tot.n++; } else { t.r++; tot.r++; }
  }
  var p = gradeWord(it.w, g);
  var s = S.sess;
  if(s){ s.answered++; if(g >= 2) s.right++; else s.again++; s.lastResult = { g:g, iv:p.iv, word:it.w }; }
  if(g === 0 && it.wrong < 2){
    it.wrong++;
    var pos = Math.min(4, s ? s.q.length : 0);
    if(s) s.q.splice(pos, 0, it);
  }
  saveStats(); saveProg();
  renderTop();
}
/* 用户主动评分（card 模式） */
function userGrade(g){
  var s = S.sess; if(!s || !s.cur) return;
  record(s.cur, g);
  nextItem();
}
/* 拼写题 / 选择题：自动判定 */
function autoAnswer(it, correct){

function renderTop(){
  var now = Date.now(), n = dueList(now).length;
  $("#pillStreak").textContent = "🔥 " + streakDays() + " 天";
  var pd = $("#pillDue");
  pd.textContent = "待复习 " + n;
  pd.classList.toggle("hot", n > 0);
  var learned = learnedCount(), total = S.deck.length;
  var t = today();
  $("#topSub").textContent = "已学 " + learned + "/" + total +
    " · 今日新词 " + t.n + "/" + S.set.newPerDay + " · 复习 " + t.r;
  $$("#tabbar button").forEach(function(b){
    var on = b.getAttribute("data-tab") === S.tab;
    b.classList.toggle("on", on);
    var old = $(".badge", b); if(old) old.remove();
    if(b.getAttribute("data-tab") === "study" && n > 0){
      var sp = document.createElement("span");
      sp.className = "badge"; sp.textContent = n > 99 ? "99+" : n;
      b.appendChild(sp);
    }
  });
}
function setView(html){ $("#v-" + S.tab).innerHTML = html; }
function fillIpa(el, word){
  var d = findWord(word) || {};
  var x = PH[word.toLowerCase()];
  var ipa = (d.ipa || "") || (x && x.ipa) || "";
  if(ipa && ipa.charAt(0) !== "/") ipa = "/" + ipa + "/";
  el.textContent = ipa;
}
function extraHTML(word){
  var x = PH[word.toLowerCase()];
  if(x && x.ex && x.ex.en) return '<div class="ex"><b>' + esc(x.ex.en) + "</b>" + (x.ex.cn ? "<br>" + esc(x.ex.cn) : "") + "</div>";
  return "";
}

  var d = findWord(it.w) || { w: it.w, def: "" };
  var lv = levelOf(S.prog[it.w.toLowerCase()]);

}
function renderStudy(){
  var s = S.sess;
  if(s && !s.finished && s.cur){ renderCard(); return; }
  if(s && s.finished){ renderSummary(); return; }
  renderHome();
}

          '<div class="big-num"><b class="mono">' + t.n + "/" + S.set.newPerDay + "</b><span>今日新词</span></div>" +
          '<div class="big-num"><b class="mono">' + streakDays() + "</b><span>连续天数</span></div>" +
        "</div>" +
        '<div style="margin-top:14px">' +
          '<div class="btn primary block lg" data-act="start">' +
            (overdue ? "开始复习（" + overdue + " 词）" : (newLeft ? "开始学习新词（" + newLeft + " 词）" : "今日已完成 ✓")) +
          "</div>" +
        "</div>" +
        '<div class="center tiny dim" style="margin-top:10px">' +
          (nd ? "最近一批单词将在 " + fmtGap(nd - now) + "后到期 · 已学 " + learned + "/" + total
              : "词库共 " + total + " 词 · 已学 " + learned) +
        "</div>" +

        '<div class="row between" style="margin-top:8px"><span class="small muted">已学 ' + learned + " 词</span>" +
        '<span class="small dim">' + rate + "% · 共 " + total + " 词</span></div>" +

}
function levelBarsHTML(){
  var cnt = [0,0,0,0,0,0];
  var learned = 0;
  for(var k in S.prog){
    var p = S.prog[k];
    if(!p || !p.seen || !INDEX[k]) continue;
    learned++;
    cnt[levelOf(p)]++;
  }
  cnt[0] = Math.max(0, S.deck.length - learned);
  var mx = Math.max.apply(null, cnt) || 1;
  var h = '<div class="bars">';
  for(var i=0;i<6;i++){
    var hp = Math.max(2, Math.round(cnt[i] / mx * 82));
    h += '<div class="bar"><span class="mono">' + cnt[i] + '</span><i style="height:' + hp + 'px"></i>' +
         "<span>" + LEVEL_NAME[i] + "</span></div>";
  }
  return h + "</div>";
}
function renderCard(){
  var s = S.sess, it = s.cur;
  var d = findWord(it.w) || { w: it.w, def: "", ipa: "" };
  var done = s.answered, left = s.q.length + 1;
  var pct = Math.round(done / Math.max(1, done + left) * 100);

  var h = '<div class="study-wrap">';
  h += '<div class="progress-line"><i style="width:' + pct + '%"></i></div>';
  h += cardHead(it);

  if(it.q === "spell" && s.phase === "q"){
    h += '<div class="word-card">' +
          '<div class="def-box" style="text-align:center;border-style:solid">' +
            '<div class="small dim" style="margin-bottom:6px">根据中文释义，拼出这个单词</div>' +
            '<div style="font-size:17px;line-height:1.6">' + esc(d.def || "（无释义）") + "</div>" +
          "</div>" +
          '<div class="hint">首字母 <b style="font-size:16px">' + esc(d.w.charAt(0).toUpperCase()) + "</b> · 共 " +
            d.w.replace(/[^A-Za-z]/g,"").length + " 个字母</div>" +
          '<input id="spellIn" class="spell-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="输入英文单词，回车提交">' +
          '<div class="actions g1" style="width:100%"><button class="btn primary lg" data-act="spell-submit">提交</button></div>' +
          '<div class="actions g1" style="width:100%"><button class="btn ghost" data-act="spell-giveup">想不起来，直接看答案</button></div>' +
         "</div></div>";
    setView(h);
    var inp = $("#spellIn");
    if(inp){ inp.focus(); }
    return;
  }

  var showWord = !(it.q === "spell" && s.phase !== "q");
  h += '<div class="word-card">';
  if(showWord){
    h += '<div class="word' + (d.w.length > 12 ? " small" : "") + '">' + esc(d.w) + "</div>";
    h += '<div class="ipa"><span id="curIpa"></span>' +
         '<button class="spk" data-act="speak" title="朗读">🔊</button></div>';
  } else {
    h += '<div class="hint">正确答案</div><div class="word small" style="color:var(--acc)">' + esc(d.w) + "</div>";
  }

  if(it.q === "choice" && s.phase === "q"){
    if(!it.opts) it.opts = choiceOptions(it.w);
    var opts = it.opts;
    h += '<div class="choices">';
    opts.forEach(function(o, i){
      h += '<button class="choice" data-act="choose" data-i="' + i + '">' + esc(o.t) + "</button>";
    });
    h += "</div>";
    setView(h + "</div></div>");
    fillIpa($("#curIpa"), it.w);
    return;
  }

  if(s.phase === "q"){
    h += '<div class="reveal-tap" data-act="reveal">点击查看释义　<span class="kbd">空格</span></div>';
    if(S.set.mode === "quick"){
      h += '<div class="actions" style="width:100%">' +
           '<button class="btn lg" data-act="grade" data-g="0" style="border-color:color-mix(in srgb,var(--dan) 40%,transparent);color:var(--dan)">不认识</button>' +
           '<button class="btn lg" data-act="grade" data-g="2" style="border-color:color-mix(in srgb,var(--acc) 40%,transparent);color:var(--acc)">认识</button>' +
           "</div>";
    } else {
      h += gradeButtonsHTML();
    }
  } else if(s.phase === "a"){
    h += '<div class="def-box"><div><span class="pos">释</span>' + esc(d.def || "（无释义）") + "</div>" +
         extraHTML(it.w) + "</div>";
    h += gradeButtonsHTML();
  } else if(s.phase === "r"){
    var ok = s.lastResult && s.lastResult.g >= 2;
    h += '<div class="def-box"><div><span class="pos">释</span>' + esc(d.def || "（无释义）") + "</div>" +
         extraHTML(it.w) + "</div>";
    h += '<div class="' + (ok ? "okbox" : "warnbox") + ' center">' +
         (ok ? "✓ 答对了，记得很牢" : "✗ 再记一遍，它很快会重新出现") + "</div>";
    h += '<div class="actions g1"><button class="btn primary lg" data-act="next">继续　<span class="kbd">空格</span></button></div>';
  }
  h += "</div></div>";
  setView(h);
  if($("#curIpa")) fillIpa($("#curIpa"), it.w);
  if(s.phase === "a"){ /* 已揭示 */
    var eb = $("#curIpa"); if(eb) fillIpa(eb, it.w);
  }
}
function gradeButtonsHTML(){
  var h = '<div class="actions g4" style="width:100%">';
  GRADES.forEach(function(G){
    h += '<button class="gbtn ' + G.cls + '" data-act="grade" data-g="' + G.g + '">' + G.name +
         "<small>" + G.tip + "</small></button>";
  });
  return h + "</div>";
}
function choiceOptions(word){
  var d = findWord(word);
  var right = { t: (d && d.def) || "（无释义）", ok:true };
  var pool = [], n = S.deck.length;
  for(var i=0;i<n && pool.length<3;i++){
    var r = S.deck[Math.floor(Math.random()*n)];
    if(!r || r.w.toLowerCase() === word.toLowerCase()) continue;
    if(!r.def || r.def === right.t) continue;
    var dup = false;
    for(var j=0;j<pool.length;j++){ if(pool[j].t === r.def) dup = true; }
    if(dup) continue;
    pool.push({ t: r.def, ok:false });
  }
  while(pool.length < 3){ pool.push({ t: "以上都不对（干扰项）", ok:false }); }
  var opts = pool.concat([right]);
  shuffle(opts);
  return opts;
}

var PH = load(LS.ph, {});
var phDirty = false, phPending = {};
function savePH(){ if(phDirty){ save(LS.ph, PH); phDirty = false; } }
function ensurePhonetic(word, cb){
  if(!S.set.onlinePhonetic) return;
  var k = String(word).toLowerCase();
  if(PH[k] !== undefined && PH[k] !== null){ if(cb) cb(PH[k]); return; }
  if(PH[k] === null) return;                  /* 已尝试过，不再重试 */
  if(phPending[k]) return;
  var have = 0; for(var x in PH){ have++; if(have > 6000) return; }
  phPending[k] = 1;
  fetch("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(word))
    .then(function(r){ if(!r.ok) throw new Error("bad status " + r.status); return r.json(); })
    .then(function(j){
      var ipa = "", ex = null;
      (j || []).forEach(function(e){
        if(!ipa && e.phonetic) ipa = e.phonetic;
        if(!ipa && e.phonetics) (e.phonetics || []).forEach(function(p){ if(!ipa && p.text) ipa = p.text; });
        if(!ex && e.meanings) (e.meanings || []).forEach(function(m){
          (m.definitions || []).forEach(function(df){
            if(!ex && df.example) ex = { en: df.example, cn: "" };
          });
        });
      });
      PH[k] = { ipa: ipa, ex: ex };
      phDirty = true; savePH();
      delete phPending[k];
      if(cb) cb(PH[k]);
    })
    .catch(function(){ PH[k] = null; phDirty = true; savePH(); delete phPending[k]; });
}

 * 8. 交互：答题 / 键盘 / 标签页

function reveal(){
  var s = S.sess;
  if(s && s.cur && s.phase === "q"){ s.phase = "a"; renderStudy(); }
}
function submitSpell(){
  var s = S.sess;
  if(!s || !s.cur || s.phase !== "q") return;
  var inp = $("#spellIn"); if(!inp) return;
  var val = inp.value.trim().toLowerCase().replace(/\s+/g, " ");
  if(!val){ toast("先输入单词"); inp.focus(); return; }
  var ok = (val === s.cur.w.toLowerCase());
  inp.classList.add(ok ? "spell-ok" : "spell-bad");
  inp.blur();
  autoAnswer(s.cur, ok);
}
function chooseOption(i){
  var s = S.sess;
  if(!s || !s.cur || s.phase !== "q") return;
  var it = s.cur;
  if(it.locked) return;
  it.locked = true;
  if(!it.opts) it.opts = choiceOptions(it.w);
  var opt = it.opts[i];
  if(!opt) return;
  var box = document.querySelector('.choice[data-i="' + i + '"]');
  if(box) box.classList.add(opt.ok ? "right" : "wrong");
  if(!opt.ok){
    /* 标出正确答案 */
    it.opts.forEach(function(o, j){
      if(o.ok){ var b = document.querySelector('.choice[data-i="' + j + '"]'); if(b) b.classList.add("right"); }
    });
  }
  setTimeout(function(){ autoAnswer(it, !!opt.ok); }, 320);
}
function switchTab(tab){
  S.tab = tab;
  $$("#main .view").forEach(function(v){ v.classList.add("hidden"); });
  var el = $("#v-" + tab);
  if(el) el.classList.remove("hidden");
  renderTop();
  if(tab === "study") renderStudy();
  else if(tab === "stats") renderStats();
  else if(tab === "deck") renderDeck();
  else renderSet();
}
document.addEventListener("click", function(ev){
  var t = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if(!t) return;
  var act = t.getAttribute("data-act");
  var s = S.sess;
  if(act === "tab"){ switchTab(t.getAttribute("data-tab")); return; }
  if(act === "start"){ startSession(); return; }
  if(act === "end"){ S.sess = null; renderTop(); renderStudy(); return; }
  if(act === "speak"){ speak(s && s.cur ? s.cur.w : (t.getAttribute("data-w") || "")); return; }
  if(act === "reveal"){ reveal(); return; }
  if(act === "grade"){ if(s && s.cur) userGrade(parseInt(t.getAttribute("data-g"), 10)); return; }
  if(act === "next"){ nextItem(); return; }
  if(act === "spell-submit"){ submitSpell(); return; }
  if(act === "spell-giveup"){
    if(s && s.cur && s.phase === "q"){ s.phase = "a"; autoAnswer(s.cur, false); }
    return;
  }
  if(act === "choose"){ chooseOption(parseInt(t.getAttribute("data-i"), 10)); return; }
  var h = HANDLERS[act];
  if(h){ h(t, ev); }
});
var HANDLERS = {};   /* 后续视图注册自己的动作 */

document.addEventListener("keydown", function(ev){
  var tag = (ev.target && ev.target.tagName) || "";
  var typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
  var s = S.sess;
  if(typing && ev.key !== "Enter") return;
  if(!s || !s.cur || s.finished) return;
  var ph = s.phase;
  if(ev.key === "Enter"){
    if(s.cur.q === "spell" && ph === "q"){ ev.preventDefault(); submitSpell(); }
    else if(ph === "r"){ ev.preventDefault(); nextItem(); }
    return;
  }
  if(ev.key === " " || ev.code === "Space"){
    ev.preventDefault();
    if(ph === "q") reveal(); else if(ph === "r") nextItem();
    return;
  }
  if(ph === "q" && S.set.mode === "quick"){
    if(ev.key === "1" || ev.key === "ArrowLeft"){ ev.preventDefault(); reveal(); }
    else if(ev.key === "2" || ev.key === "ArrowRight"){ ev.preventDefault(); userGrade(2); }
    return;
  }
  if(ph === "a" && "1234".indexOf(ev.key) >= 0){ ev.preventDefault(); userGrade(parseInt(ev.key, 10) - 1); }
});

document.addEventListener("visibilitychange", function(){
  flushSaves();
  if(document.hidden) return;
  if(S.sess && S.sess.cur && !S.sess.finished) return;   /* 学习中不打断 */
  renderTop();
  if(S.tab === "study") renderStudy();
});

function renderStats(){
  var now = Date.now(), learned = learnedCount(), total = S.deck.length;
  var tot = S.stats.total;
  var acc = tot.q ? Math.round(tot.g / tot.q * 100) : 0;
  var dayN = Object.keys(S.stats.days).filter(function(k){
    var d = S.stats.days[k]; return d && (d.n || d.r);
  }).length;

  var h = '<div class="study-wrap">';
  h += '<div class="sec-title">累计</div><div class="card"><div class="big-nums">' +
       '<div class="big-num"><b class="mono">' + learned + "</b><span>已学单词</span></div>" +
       '<div class="big-num"><b class="mono">' + tot.q + "</b><span>累计作答</span></div>" +
       '<div class="big-num"><b class="mono">' + acc + "%</b><span>总正确率</span></div>" +
       "</div><div class=\"hr\"></div><div class=\"big-nums\">" +
       '<div class="big-num"><b class="mono">' + dayN + "</b><span>学习天数</span></div>" +
       '<div class="big-num"><b class="mono">' + streakDays() + "</b><span>连续天数</span></div>" +
       '<div class="big-num"><b class="mono">' + tot.n + "</b><span>累计新词</span></div>" +
       "</div></div>";

  h += '<div class="sec-title">掌握程度分布</div><div class="card">' + levelBarsHTML() +
       '<div class="center tiny dim" style="margin-top:6px">共 ' + total + " 词 · 已学 " + learned + " 词</div></div>";

  var fc = forecast(7);
  var mx = Math.max.apply(null, fc) || 1;
  h += '<div class="sec-title">未来 7 天复习量预测</div><div class="card"><div class="bars">';
  var wk = ["日","一","二","三","四","五","六"];
  for(var i=0;i<7;i++){
    var dt = new Date(startOfDay(now) + i * DAY);
    var lbl = i === 0 ? "今天" : "周" + wk[dt.getDay()];
    var hp = Math.max(2, Math.round(fc[i] / mx * 82));
    h += '<div class="bar"><span class="mono">' + fc[i] + '</span><i style="height:' + hp + 'px"></i><span>' + lbl + "</span></div>";
  }
  h += "</div><div class=\"center tiny dim\" style=\"margin-top:8px\">今天包含已到期的积压词，共 " + fc[0] + " 个</div></div>";

  /* 近 35 天热力 */
  h += '<div class="sec-title">最近 35 天</div><div class="card"><div class="heat">';
  for(var d = 34; d >= 0; d--){
    var kk = dayKey(now - d * DAY), dd = S.stats.days[kk];
    var q = dd ? ((dd.n|0) + (dd.r|0)) : 0;
    var lv = q === 0 ? "" : (q < 10 ? "l1" : q < 25 ? "l2" : q < 50 ? "l3" : "l4");
    h += '<i class="' + lv + '" title="' + kk + "：" + q + ' 次"></i>';
  }
  h += "</div></div>";

  /* 遗忘预警 */
  var risk = [];
  for(var k2 in S.prog){
    var p = S.prog[k2];
    if(!p || !p.seen || !INDEX[k2]) continue;
    var r = retention(p, now);
    if(r < 0.78) risk.push({ w: INDEX[k2].w, r: r, def: INDEX[k2].def, due: p.due, iv: p.iv });
  }
  risk.sort(function(a,b){ return a.r - b.r; });
  h += '<div class="sec-title">遗忘预警（按记忆保留率升序）</div><div class="card">';
  if(!risk.length){
    h += '<div class="dim small center">暂无预警，保持节奏 👌</div>';
  } else {
    h += '<div class="list">';
    risk.slice(0, 12).forEach(function(x){
      h += '<div class="it"><div style="flex:1;min-width:0"><b>' + esc(x.w) + '</b>' +
           '<div class="tiny dim" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(x.def) + "</div></div>" +
           '<span class="lv" style="color:' + (x.r < 0.5 ? "var(--dan)" : "var(--warn)") + '">' +
           Math.round(x.r * 100) + "%</span></div>";
    });
    h += "</div>";
    if(risk.length > 12) h += '<div class="center tiny dim" style="margin-top:8px">还有 ' + (risk.length - 12) + " 个单词需要巩固</div>";
  }
  h += "</div></div>";
  setView(h);
}

function fetchText(url){
  return new Promise(function(resolve, reject){
    var done = false;
    var ctl = ("AbortController" in window) ? new AbortController() : null;
    var tm = setTimeout(function(){
      if(done) return; done = true;
      if(ctl) try{ ctl.abort(); }catch(e){}
      reject(new Error("超时"));
    }, 25000);
    fetch(url, ctl ? { signal: ctl.signal, cache: "no-cache" } : {})
      .then(function(r){
        if(!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function(txt){
        if(done) return; done = true; clearTimeout(tm); resolve(txt);
      })
      .catch(function(e){
        if(done) return; done = true; clearTimeout(tm); reject(e);
      });
  });
}
function tryUrls(list, onStep){
  var i = 0;
  function step(){
    if(i >= list.length) return Promise.reject(new Error("所有源都失败了"));
    var s = list[i++];
    if(onStep) onStep(s, i, list.length);
    return fetchText(s.u).then(function(txt){
      var arr = s.fmt === "json" ? parseDeckJson(txt) : parseDeckText(txt);
      if(!arr || arr.length < 20) throw new Error("内容不完整（" + (arr ? arr.length : 0) + " 词）");
      return { src:s, text:txt, arr:arr };
    }).catch(function(e){
      if(onStep) onStep(s, i, list.length, e);
      return step();
    });
  }
  return step();
}
function applyDeck(res){
  var fmt = res.src.fmt || "txt";
  var arr = saveDeckText(res.text, fmt, res.src.n === "本地导入" ? "import" : "online", res.src.name || res.src.n);
  if(!arr) throw new Error("保存失败");
  S.sess = null;
  return arr;
}

  }).then(function(res){

  }).catch(function(e){

    DL.msg = "下载失败：" + (e.message || e) + "。可能是网络无法访问 GitHub，可以点「导入本地文件」手动添加。";
    renderDeck();

function importFile(file){
  var rd = new FileReader();
  rd.onload = function(){
    var txt = String(rd.result || "");
    var name = file.name || "本地导入";
    var fmt = /\.jsonl?$/i.test(name) ? "json" : (/^\s*[\[{]/.test(txt) ? "json" : "txt");
    try{
      var arr = saveDeckText(txt, fmt, "import", name);
      if(!arr) throw new Error("保存失败");
      S.sess = null;
      DL = { state:"ok", msg:"已导入《" + name + "》共 " + arr.length + " 词", pct:100, log:[] };
      renderTop(); renderDeck();
      toast("导入成功：" + arr.length + " 词");
    }catch(e){
      DL = { state:"err", msg:"导入失败：" + (e.message || e), pct:0, log:[] };
      renderTop(); renderDeck();
    }
  };
  rd.readAsText(file, "utf-8");
}
function downloadFile(name, content, mime){
  var blob = new Blob([content], { type: mime || "application/octet-stream" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ try{ URL.revokeObjectURL(a.href); a.remove(); }catch(e){} }, 1500);
}

function snapshotHTML(){

  modal.innerHTML = ""; modal.classList.add("hidden");
  var views = $$("#main .view"), vHTML = views.map(function(v){ return v.innerHTML; });

  var out = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;

  modal.innerHTML = mHTML; modal.className = mCls;
  tl.textContent = tTxt;
  ensureFileInputs();

/* 生成内嵌词库的独立版 HTML 字符串 */
function buildStandaloneHTML(){
  var d = load(LS.deck, null);
  var em = embeddedDeck();
  var payload = null;
  if(d && d.text) payload = { fmt:d.fmt || "txt", text:d.text, name:d.name || "六级完整词库" };
  else if(em) payload = { fmt:em.fmt || "txt", text:em.text, name:em.name || "六级完整词库" };
  else if(S.deck && S.deck.length){
    payload = {
      fmt:"txt",
      name:"六级核心词库（" + S.deck.length + " 词）",
      text: S.deck.map(function(x){ return x.w + "\t" + (x.def || ""); }).join("\n")
    };
  }
  if(!payload || !payload.text) throw new Error("没有可打包的词库");
  var json = JSON.stringify(payload).replace(/</g, "\\u003c");
  var html = snapshotHTML();
  var re = /(<script[^>]*id="embeddedDeck"[^>]*>)([\s\S]*?)(<\/script>)/;
  if(!re.test(html)) throw new Error("找不到数据锚点，无法打包");
  return { html: html.replace(re, function(m, a, b, c){ return a + json + c; }), words: parseByFmt(payload.text, payload.fmt).length };
}

    toast("已生成独立版（" + r.words + " 词），可以直接发给别人");
  }catch(e){ toast("打包失败：" + (e.message || e)); }
}
function exportData(){
  var data = {
    v: 1, at: Date.now(),
    set: S.set, stats: S.stats, prog: S.prog,
    deck: load(LS.deck, null), meta: S.meta
  };
  try{
    downloadFile("cet6-backup-" + dayKey() + ".json", JSON.stringify(data), "application/json");
    toast("已导出备份文件");
  }catch(e){ toast("导出失败：" + e.message); }
}
function importData(file){
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var d = JSON.parse(String(rd.result || "{}"));
      if(!d || typeof d !== "object") throw new Error("格式不对");
      if(d.set) save(LS.set, d.set);
      if(d.stats) save(LS.stats, d.stats);
      if(d.prog) save(LS.prog, d.prog);
      if(d.deck) save(LS.deck, d.deck);
      toast("备份已导入，正在刷新…");
      setTimeout(function(){ location.reload(); }, 700);
    }catch(e){ toast("导入失败：" + e.message); }
  };
  rd.readAsText(file, "utf-8");
}
function wipeKeys(){
  [LS.prog, LS.set, LS.stats, LS.deck, LS.ph, LS.flag].forEach(function(k){
    try{ localStorage.removeItem(k); }catch(e){}
  });
}
HANDLERS["dl-deck"] = function(){ downloadDeck(); };
HANDLERS["dl-custom"] = function(){
  var inp = $("#customUrl"), u = inp ? inp.value.trim() : "";
  if(!u){ toast("请填写词库地址"); return; }
  DL = { state:"run", msg:"正在拉取自定义地址…", pct:20, log:[] };
  renderDeck();
  fetchText(u).then(function(txt){
    var fmt = (/\.jsonl?$/i.test(u) || /^\s*[\[{]/.test(txt)) ? "json" : "txt";
    var arr = saveDeckText(txt, fmt, "import", u.replace(/^https?:\/\//,"").slice(0,40));
    if(!arr) throw new Error("保存失败");
    S.sess = null;
    DL = { state:"ok", msg:"已载入 " + arr.length + " 词", pct:100, log:[] };
    renderTop(); renderDeck(); toast("词库已更新");
  }).catch(function(e){
    DL = { state:"err", msg:"拉取失败：" + (e.message || e), pct:0, log:[] };
    renderDeck();
  });
};
HANDLERS["pick-file"] = function(){ var el = $("#fileIn"); if(el) el.click(); };
HANDLERS["restore-seed"] = function(){
  openSheet("<h3>恢复内置词库？</h3><div class='small muted'>学习进度（哪些词已学、掌握程度）会保留，只替换词库内容。</div>" +
    "<div class='actions g2' style='margin-top:14px'><button class='btn ghost' data-act='close-sheet'>取消</button>" +
    "<button class='btn primary' data-act='do-restore'>确定</button></div>");
};
HANDLERS["do-restore"] = function(){
  try{ localStorage.removeItem(LS.deck); }catch(e){}
  S.meta.src = "seed"; S.meta.srcName = "内置核心词";
  S.deck = SEED.map(function(a){ return { w:a[0], ipa:a[1], def:a[2] }; });
  rebuildIndex(); S.sess = null;
  DL = { state:"idle", msg:"", pct:0, log:[] };
  closeSheet(); renderTop(); renderDeck(); toast("已恢复内置词库");
};
HANDLERS["export"] = function(){ exportData(); };
HANDLERS["pack"] = function(){ packStandalone(); };
HANDLERS["import-data"] = function(){ var el = $("#dataIn"); if(el) el.click(); };
HANDLERS["clear-prog"] = function(){
  openSheet("<h3>清空学习记录？</h3><div class='warnbox'>所有单词的复习进度、统计与打卡记录都会被删除，且无法恢复。</div>" +
    "<div class='actions g2' style='margin-top:14px'><button class='btn ghost' data-act='close-sheet'>取消</button>" +
    "<button class='btn primary' data-act='do-clear'>清空</button></div>");
};
HANDLERS["do-clear"] = function(){
  try{ localStorage.removeItem(LS.prog); localStorage.removeItem(LS.stats); }catch(e){}
  S.prog = {}; S.stats = { days:{}, total:{n:0,r:0,a:0,g:0,q:0} };
  S.sess = null; closeSheet(); renderTop(); renderStudy(); toast("学习记录已清空");
};
HANDLERS["reset-all"] = function(){
  openSheet("<h3>全部重置？</h3><div class='warnbox'>包括词库、设置、进度和统计，全部恢复到初始状态。</div>" +
    "<div class='actions g2' style='margin-top:14px'><button class='btn ghost' data-act='close-sheet'>取消</button>" +
    "<button class='btn primary' data-act='do-reset'>全部重置</button></div>");
};
HANDLERS["do-reset"] = function(){ wipeKeys(); location.reload(); };
HANDLERS["close-sheet"] = function(){ closeSheet(); };
HANDLERS["toggle"] = function(t){
  var k = t.getAttribute("data-key");
  if(k === "theme") S.set.theme = (S.set.theme === "light") ? "dark" : "light";
  else S.set[k] = !S.set[k];
  saveSet();
  if(k === "theme") applyTheme();
  renderSet();
};
HANDLERS["onboard-done"] = function(t){
  var v = parseInt(t.getAttribute("data-v"), 10);
  S.set.newPerDay = v; saveSet();
  S.meta.onboarded = 1; save(LS.flag, S.meta);
  closeSheet(); renderTop(); renderStudy();
};
HANDLERS["onboard-dl"] = function(){
  S.meta.onboarded = 1; save(LS.flag, S.meta);
  closeSheet(); switchTab("deck"); downloadDeck();
};
document.addEventListener("change", function(ev){
  var t = ev.target;
  if(!t || !t.getAttribute) return;
  if(t.id === "fileIn" && t.files && t.files[0]){ importFile(t.files[0]); t.value = ""; return; }
  if(t.id === "dataIn" && t.files && t.files[0]){ importData(t.files[0]); t.value = ""; return; }
  var k = t.getAttribute("data-sel");
  if(!k) return;
  var v = t.value;
  if(k === "newPerDay" || k === "reviewPerDay") v = parseInt(v, 10);
  else if(k === "spellRatio" || k === "choiceRatio") v = parseFloat(v);
  S.set[k] = v; saveSet();
  if(k === "spellRatio" || k === "choiceRatio"){
    if(S.set.spellRatio + S.set.choiceRatio > 0.6){
      toast("两种题型比例合计不要超过 60%");
      S.set[k] = 0.1; saveSet(); renderSet(); return;
    }
  }
  renderTop();
  toast("已保存");
});
document.addEventListener("input", function(ev){
  var t = ev.target;
  if(!t || !t.getAttribute) return;
  if(t.getAttribute("data-input") === "deck"){ S.deckQ = t.value; renderDeckList(); }
});

/* ------------------------------------------------------------------ *
 * 14. 初始化
 * ------------------------------------------------------------------ */
function showOnboarding(){
  openSheet(
    "<h3>欢迎使用 CET-6 背单词 👋</h3>" +
    "<div class='small muted'>按记忆曲线安排复习：先自测「认识 / 不认识」，系统再根据你的作答" +
    "推算每个单词该在什么时候重新出现。隔一段时间回来，它会先把到期的词挑出来考你。</div>" +
    "<div class='hr'></div>" +
    "<b class='small'>每天学多少个新词？</b>" +
    "<div class='actions g3' style='margin-top:10px'>" +
      "<button class='btn' data-act='onboard-done' data-v='10'>10 个</button>" +
      "<button class='btn primary' data-act='onboard-done' data-v='20'>20 个</button>" +
      "<button class='btn' data-act='onboard-done' data-v='30'>30 个</button>" +
    "</div>" +
    "<div class='tiny dim' style='margin-top:12px'>当前使用内置核心词库（离线可用，约 " + SEED.length + " 词）。" +
    "想要完整六级词库（约 5651 词），可在「词库」页一键下载，或用本地文件导入。</div>" +
    "<div class='actions g1' style='margin-top:12px'>" +
      "<button class='btn ghost' data-act='onboard-dl'>直接下载完整词库</button>" +
    "</div>"
  );
}
function ensureFileInputs(){
  ["fileIn", "dataIn"].forEach(function(id){
    if(document.getElementById(id)) return;
    var el = document.createElement("input");
    el.type = "file"; el.id = id; el.style.display = "none";
    el.accept = id === "fileIn" ? ".txt,.json,.jsonl,.tsv,text/plain" : ".json";
    document.body.appendChild(el);
  });
}
function init(){
  loadAll();
  S.prevOpen = S.meta.lastOpen || 0;
  S.deckQ = "";
  shuffle(S.deck);                      /* 打乱词序，避免一直停在 a 开头 */
  ensureFileInputs();
  switchTab("study");
  renderTop();
  touchOpen();
  setInterval(touchOpen, 60000);
  window.addEventListener("beforeunload", function(){ touchOpen(); flushSaves(); });
  window.addEventListener("pagehide", function(){ touchOpen(); flushSaves(); });
  if(!S.meta.onboarded) setTimeout(showOnboarding, 260);
}
function touchOpen(){ S.meta.lastOpen = Date.now(); save(LS.flag, S.meta); }
init();
</script>
